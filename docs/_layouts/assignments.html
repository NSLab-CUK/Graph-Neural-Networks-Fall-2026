---
layout: page
---

{{ content }}
<ul id="archive">
{% for asg in site.assignments %}
      <li class="archiveposturl" style="background: transparent">
        <span><a href="{{ asg.url | prepend: site.baseurl}}">{{ asg.title }}</a></span>
<strong style="font-size:100%; font-family: 'Titillium Web', sans-serif; float:right">
{% if asg.links %}
{% assign first_link = asg.links | first %}
<a title="Open {{ first_link.name }}" href="{% include url.html url=first_link.url %}"><i class="fas fa-code"></i></a>
{% endif %}
{% if asg.solutions %}
&nbsp; <a title="Open solutions" href="{% include url.html url=asg.solutions %}"><i class="fas fa-check-circle"></i></a>
{% endif %}
</strong>
      </li>
{% endfor %}
</ul>
